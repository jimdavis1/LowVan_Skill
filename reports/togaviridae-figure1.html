    <figcaption><b>How to read a row:</b> the orange block ends at the best score that
    feature's profiles reach on sequence that is <i>not</i> that feature; the blue block
    begins at the weakest score they reach on a real one. Any cutoff in the white gap
    between them separates the two perfectly &mdash; so the gap is the decision, and its
    width is how much room for error the feature has. The three numbers at the right are
    noise · <b>cutoff</b> · weakest signal. If the two blocks ever touched there would be
    no safe value and the profiles would need splitting instead. Measured with tblastn
    against 333 genomes spanning 31 species &mdash; the nine rep-contig genomes plus every
    near-complete genome of a divergent species, so the weakest signal is measured where it
    is actually weakest rather than on Chikungunya.</figcaption>
